<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日影制限シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; margin: 0; }
        input[type=range] { height: 1.5rem; width: 100%; cursor: pointer; accent-color: #2563eb; }
    </style>
</head>
<body>
    <div id="root">読み込み中...</div>

    <script type="text/babel">
        // ライブラリのグローバル参照
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot } = window.Recharts;
        const { useState, useMemo } = React;

        const ShadowSimulator = () => {
            const [h, setH] = useState(14.0);
            const [z, setZ] = useState(6.5);
            const [d, setD] = useState(5.0);
            const [limitHours, setLimitHours] = useState(3.0);
            const lat = 35.7;

            // 太陽高度計算（冬至）
            const calculateSunAlt = (hour) => {
                const delta = -23.44 * Math.PI / 180;
                const phi = lat * Math.PI / 180;
                const h_angle = (hour - 12) * 15 * Math.PI / 180;
                const sin_h = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(h_angle);
                return Math.asin(sin_h);
            };

            // 日影時間計算
            const getShadowDuration = (targetH, targetD, targetZ) => {
                const deltaH = targetH - targetZ;
                if (deltaH <= 0) return 0;
                let duration = 0;
                for (let t = 8; t <= 16; t += 0.05) {
                    const alt = calculateSunAlt(t);
                    if (alt > 0 && (deltaH / Math.tan(alt)) > targetD) duration += 0.05;
                }
                return duration;
            };

            // 限界曲線データ生成
            const chartData = useMemo(() => {
                const data = [];
                for (let dist = 0; dist <= 30; dist += 1) {
                    let maxHeight = z;
                    for (let testH = z; testH <= 45; testH += 0.1) {
                        if (getShadowDuration(testH, dist, z) <= limitHours) {
                            maxHeight = testH;
                        } else { break; }
                    }
                    data.push({ 距離: dist, 限界高さ: parseFloat(maxHeight.toFixed(2)) });
                }
                return data;
            }, [z, limitHours]);

            const currentDuration = getShadowDuration(h, d, z);
            const isOk = currentDuration <= limitHours;

            const sunLines = [
                { time: "8:00", alt: calculateSunAlt(8), color: "#f97316" },
                { time: "12:00", alt: calculateSunAlt(12), color: "#fbbf24" },
                { time: "16:00", alt: calculateSunAlt(16), color: "#f43f5e" }
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">
                    <div className="w-full max-w-5xl space-y-6">
                        
                        <header className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg border-l-8 border-blue-500 text-center md:text-left">
                            <h1 className="text-2xl font-bold tracking-tight">日影制限シミュレーター</h1>
                            <p className="text-sm opacity-70 mt-1">冬至 / 東京（北緯35.7°）基準</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* 設定パネル */}
                            <div className="lg:col-span-1 space-y-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold mb-6 text-sm uppercase tracking-widest text-slate-500 border-b pb-2">条件設定</h2>
                                    <div className="space-y-6 text-sm font-medium">
                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span>建物高さ (H)</span> <span className="text-blue-600">{h.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="1" max="40" step="0.1" value={h} onChange={(e)=>setH(Number(e.target.value))} />
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span>判定面高さ (Z)</span> <span className="text-blue-600">{z.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="0" max="15" step="0.1" value={z} onChange={(e)=>setZ(Number(e.target.value))} />
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span>境界距離 (D)</span> <span className="text-blue-600">{d.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="0" max="30" step="0.1" value={d} onChange={(e)=>setD(Number(e.target.value))} />
                                        </div>
                                        <div>
                                            <div className="flex justify-between mb-2 font-bold">
                                                <span className="text-slate-500 uppercase">規制時間</span> <span className="text-orange-600">{limitHours.toFixed(1)}h</span>
                                            </div>
                                            <input type="range" min="2" max="5" step="0.5" value={limitHours} onChange={(e)=>setLimitHours(Number(e.target.value))} />
                                        </div>
                                    </div>
                                </div>

                                <div className={`p-6 rounded-2xl shadow-inner text-center border-t-4 ${isOk ? 'bg-blue-50 border-blue-500' : 'bg-red-50 border-red-500'}`}>
                                    <div className="text-xs font-bold text-slate-500 uppercase">判定</div>
                                    <div className={`text-4xl font-black my-1 ${isOk ? 'text-blue-600' : 'text-red-600'}`}>
                                        {isOk ? "適合" : "不適合"}
                                    </div>
                                    <div className="text-sm font-bold text-slate-600">
                                        日影: {currentDuration.toFixed(1)}h / {limitHours.toFixed(1)}h
                                    </div>
                                </div>
                            </div>

                            {/* 描画エリア */}
                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center">📈 建物高さ × 境界距離 限界曲線</h3>
                                    <div className="h-[250px] w-full">
                                        <ResponsiveContainer>
                                            <AreaChart data={chartData} margin={{ top: 10, right: 10, left: -10, bottom: 10 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false} />
                                                <XAxis dataKey="距離" tick={{fontSize: 10}} />
                                                <YAxis domain={[0, 45]} tick={{fontSize: 10}} />
                                                <Tooltip />
                                                <Area type="monotone" dataKey="限界高さ" stroke="#2563eb" strokeWidth={3} fill="#dbeafe" />
                                                <ReferenceDot x={d} y={h} r={6} fill={isOk ? "#2563eb" : "#ef4444"} stroke="#fff" strokeWidth={2} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-4 uppercase tracking-wider">📐 断面図 (単位:m)</h3>
                                    <div className="relative w-full aspect-[21/9] bg-slate-50 rounded-xl border border-slate-100 p-4 overflow-hidden">
                                        <svg viewBox="-80 -30 480 160" className="w-full h-full overflow-visible font-sans text-[8px]">
                                            {/* 凡例 (右上) */}
                                            <g transform="translate(280, -10)">
                                                {sunLines.map((sun, i) => (
                                                    <g key={i} transform={`translate(0, ${i * 12})`}>
                                                        <line x1="0" y1="0" x2="15" y2="0" stroke={sun.color} strokeWidth="2" />
                                                        <text x="20" y="3" fill="#64748b">{sun.time}の太陽光</text>
                                                    </g>
                                                ))}
                                            </g>

                                            {/* 軸と目盛り */}
                                            {[0, 10, 20, 30, 40].map(val => (
                                                <g key={val}>
                                                    <line x1="-40" y1={100 - (val * 2.5)} x2="400" y2={100 - (val * 2.5)} stroke="#e2e8f0" strokeWidth="0.5" />
                                                    <text x="-65" y={103 - (val * 2.5)} fill="#94a3b8">{val}m</text>
                                                    <line x1={val * 8} y1="0" x2={val * 8} y2="100" stroke="#e2e8f0" strokeWidth="0.5" />
                                                    <text x={-5 + (val * 8)} y="115" fill="#94a3b8">{val}m</text>
                                                </g>
                                            ))}

                                            <line x1="-40" y1="100" x2="400" y2="100" stroke="#64748b" strokeWidth="2" />
                                            <line x1="-40" y1="-20" x2="-40" y2="100" stroke="#cbd5e1" strokeWidth="1" />

                                            {/* 影の塗りつぶし */}
                                            {(() => {
                                                const alt16 = calculateSunAlt(16);
                                                const shadowMax = (h - z) / Math.tan(alt16);
                                                return (
                                                    <polygon 
                                                        points={`0,${100 - (h * 2.5)} 0,${100 - (z * 2.5)} ${shadowMax * 8},${100 - (z * 2.5)}`} 
                                                        fill="#cbd5e1" 
                                                        opacity="0.6"
                                                    />
                                                );
                                            })()}

                                            {/* 判定面 */}
                                            <line x1="-40" y1={100 - (z * 2.5)} x2="400" y2={100 - (z * 2.5)} stroke="#94a3b8" strokeDasharray="3 2" />
                                            <text x="360" y={95 - (z * 2.5)} fill="#94a3b8">Z={z}m</text>
                                            
                                            {/* 建物 */}
                                            <rect x="-30" y={100 - (h * 2.5)} width="30" height={h * 2.5} fill="#1e293b" />
                                            <text x="-30" y={90 - (h * 2.5)} fontSize="9" fontWeight="bold" fill="#1e293b">H={h}m</text>
                                            
                                            {/* 境界線 */}
                                            <line x1={d * 8} y1="-20" x2={d * 8} y2="100" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 2" />
                                            <text x={5 + (d * 8)} y="-15" fontSize="9" fill="#ef4444" fontWeight="bold">境界 D={d}m</text>

                                            {/* 太陽光線 */}
                                            {sunLines.map((sun) => {
                                                const shadowL = (h - z) / Math.tan(sun.alt);
                                                return (
                                                    <line key={sun.time} x1="0" y1={100 - (h * 2.5)} x2={shadowL * 8} y2={100 - (z * 2.5)} 
                                                          stroke={sun.color} strokeWidth="1.5" />
                                                );
                                            })}
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // レンダリング
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShadowSimulator />);
    </script>
</body>
</html>
