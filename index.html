<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日影制限シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
        body { background-color: #f1f5f9; margin: 0; }
        input[type=range] { height: 1.5rem; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root">読み込み中...（画面が真っ白な場合はブラウザのJavaScript設定を確認してください）</div>

    <script type="text/babel">
        // Rechartsから必要なコンポーネントを取り出す（CDN版の安全な参照）
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot } = window.Recharts;
        const { useState, useMemo } = React;

        const ShadowSimulator = () => {
            const [h, setH] = useState(14); // 建物高さ
            const [z, setZ] = useState(6.5); // 判定面高さ
            const [d, setD] = useState(10); // 境界距離
            const [limitHours, setLimitHours] = useState(3);
            const lat = 35.7;

            // 太陽高度計算（冬至）
            const calculateSunAlt = (hour) => {
                const delta = -23.44 * Math.PI / 180;
                const phi = lat * Math.PI / 180;
                const h_angle = (hour - 12) * 15 * Math.PI / 180;
                const sin_h = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(h_angle);
                return Math.asin(sin_h);
            };

            // 日影時間計算
            const getShadowDuration = (buildingH, boundaryD, planeZ) => {
                const deltaH = buildingH - planeZ;
                if (deltaH <= 0) return 0;
                let duration = 0;
                const step = 0.1;
                for (let t = 8; t <= 16; t += step) {
                    const alt = calculateSunAlt(t);
                    if (alt > 0) {
                        const shadowL = deltaH / Math.tan(alt);
                        if (shadowL > boundaryD) duration += step;
                    }
                }
                return duration;
            };

            // グラフデータ生成
            const chartData = useMemo(() => {
                const data = [];
                for (let dist = 2; dist <= 30; dist += 2) {
                    let maxHeight = z;
                    for (let testH = z; testH <= 40; testH += 0.5) {
                        if (getShadowDuration(testH, dist, z) <= limitHours) {
                            maxHeight = testH;
                        } else { break; }
                    }
                    data.push({ distance: dist, limitH: parseFloat(maxHeight.toFixed(1)) });
                }
                return data;
            }, [z, limitHours]);

            const currentDuration = getShadowDuration(h, d, z);
            const isOk = currentDuration <= limitHours;

            return (
                <div className="min-h-screen p-4 sm:p-6 lg:p-8">
                    <div className="max-w-5xl mx-auto space-y-6">
                        
                        <header className="bg-slate-800 text-white p-5 rounded-2xl shadow-lg">
                            <h1 className="text-xl font-bold tracking-tight">日影制限シミュレーター</h1>
                            <p className="text-xs opacity-70">冬至 / 北緯35.7° 基準</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* 設定パネル */}
                            <div className="lg:col-span-1 space-y-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold text-slate-700 mb-6 border-l-4 border-indigo-500 pl-3 text-sm uppercase">Parameters</h2>
                                    
                                    <div className="space-y-6">
                                        <div className="bg-slate-50 p-3 rounded-xl">
                                            <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                                建物高さ (H) <span className="text-indigo-600 text-sm">{h}m</span>
                                            </div>
                                            <input type="range" min="1" max="30" step="0.5" value={h} onChange={(e)=>setH(Number(e.target.value))} />
                                        </div>

                                        <div className="bg-slate-50 p-3 rounded-xl">
                                            <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                                判定面高さ (Z) <span className="text-indigo-600 text-sm">{z}m</span>
                                            </div>
                                            <input type="range" min="0" max="10" step="0.5" value={z} onChange={(e)=>setZ(Number(e.target.value))} />
                                        </div>

                                        <div className="bg-slate-50 p-3 rounded-xl">
                                            <div className="flex justify-between text-xs font-bold text-slate-500 mb-2">
                                                境界距離 (D) <span className="text-indigo-600 text-sm">{d}m</span>
                                            </div>
                                            <input type="range" min="1" max="25" step="0.5" value={d} onChange={(e)=>setD(Number(e.target.value))} />
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold text-slate-500 block mb-2 uppercase">規制時間</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                {[3, 4, 5].map(val => (
                                                    <button key={val} onClick={()=>setLimitHours(val)} 
                                                        className={`py-2 rounded-lg text-sm font-bold transition ${limitHours === val ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                        {val}h
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className={`p-6 rounded-2xl text-center shadow-lg transition-all ${isOk ? 'bg-emerald-500' : 'bg-rose-500'} text-white`}>
                                    <div className="text-4xl font-black mb-1">{isOk ? "OK" : "NG"}</div>
                                    <div className="text-xs opacity-90 font-bold uppercase tracking-widest">Shadow Duration</div>
                                    <div className="text-lg font-mono">{currentDuration.toFixed(1)} / {limitHours}.0h</div>
                                </div>
                            </div>

                            {/* グラフィックパネル */}
                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-xs font-bold text-slate-400 mb-6 flex items-center uppercase tracking-widest">
                                        Height vs Distance Chart
                                    </h3>
                                    <div className="h-[320px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <AreaChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                                <XAxis dataKey="distance" tick={{fontSize: 10}} />
                                                <YAxis domain={[0, 40]} tick={{fontSize: 10}} />
                                                <Tooltip />
                                                <Area type="stepAfter" dataKey="limitH" stroke="#6366f1" strokeWidth={2} fill="#e0e7ff" />
                                                <ReferenceDot x={d} y={h} r={8} fill={isOk ? "#10b981" : "#ef4444"} stroke="#fff" strokeWidth={3} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-xs font-bold text-slate-400 mb-4 uppercase tracking-widest">Cross Section</h3>
                                    <div className="relative w-full aspect-[21/7] bg-slate-50 rounded-xl overflow-hidden border border-slate-100">
                                        <svg viewBox="0 0 400 120" className="w-full h-full">
                                            <line x1="0" y1="100" x2="400" y2="100" stroke="#cbd5e1" strokeWidth="1" />
                                            <line x1="0" y1={100 - (z * 3)} x2="400" y2={100 - (z * 3)} stroke="#94a3b8" strokeDasharray="2
