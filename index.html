<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日影制限シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        input[type=range] { height: 1.5rem; width: 100%; cursor: pointer; accent-color: #2563eb; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceDot } = window.Recharts;
        const { useState, useMemo } = React;

        const ShadowSimulator = () => {
            const [h, setH] = useState(14.0);
            const [z, setZ] = useState(6.5);
            const [d, setD] = useState(5.0);
            const [limitHours, setLimitHours] = useState(3.0);
            const lat = 35.7;

            const calculateSunAlt = (hour) => {
                const delta = -23.44 * Math.PI / 180;
                const phi = lat * Math.PI / 180;
                const h_angle = (hour - 12) * 15 * Math.PI / 180;
                const sin_h = Math.sin(phi) * Math.sin(delta) + Math.cos(phi) * Math.cos(delta) * Math.cos(h_angle);
                return Math.asin(sin_h);
            };

            const getShadowDuration = (targetH, targetD, targetZ) => {
                const deltaH = targetH - targetZ;
                if (deltaH <= 0) return 0;
                let duration = 0;
                for (let t = 8; t <= 16; t += 0.05) {
                    const alt = calculateSunAlt(t);
                    if (alt > 0 && (deltaH / Math.tan(alt)) > targetD) duration += 0.05;
                }
                return duration;
            };

            const chartData = useMemo(() => {
                const data = [];
                for (let dist = 0; dist <= 30; dist += 1) {
                    let maxHeight = z;
                    for (let testH = z; testH <= 45; testH += 0.1) {
                        if (getShadowDuration(testH, dist, z) <= limitHours) {
                            maxHeight = testH;
                        } else { break; }
                    }
                    data.push({ 距離: dist, 限界高さ: parseFloat(maxHeight.toFixed(2)) });
                }
                return data;
            }, [z, limitHours]);

            const currentDuration = getShadowDuration(h, d, z);
            const isOk = currentDuration <= limitHours;

            // 断面図用計算
            const sunLines = [
                { time: "8:00", alt: calculateSunAlt(8) },
                { time: "12:00", alt: calculateSunAlt(12) },
                { time: "16:00", alt: calculateSunAlt(16) }
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 flex justify-center text-slate-800">
                    <div className="w-full max-w-5xl space-y-6">
                        
                        <header className="bg-slate-900 text-white p-6 rounded-2xl shadow-lg border-l-8 border-blue-500">
                            <h1 className="text-2xl font-bold tracking-tight">日影制限シミュレーター</h1>
                            <p className="text-sm opacity-70 mt-1 font-mono">Winter Solstice / Tokyo (35.7°N)</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* 操作パネル */}
                            <div className="lg:col-span-1 space-y-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="font-bold mb-6 text-sm uppercase tracking-widest text-slate-500 border-b pb-2">条件設定</h2>
                                    
                                    <div className="space-y-6 text-sm">
                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span className="font-bold">建物高さ (H)</span>
                                                <span className="text-blue-600 font-black">{h.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="1" max="40" step="0.1" value={h} onChange={(e)=>setH(Number(e.target.value))} />
                                        </div>

                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span className="font-bold">判定面の高さ (Z)</span>
                                                <span className="text-blue-600 font-black">{z.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="0" max="15" step="0.1" value={z} onChange={(e)=>setZ(Number(e.target.value))} />
                                        </div>

                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span className="font-bold">境界からの距離 (D)</span>
                                                <span className="text-blue-600 font-black">{d.toFixed(1)}m</span>
                                            </div>
                                            <input type="range" min="0" max="30" step="0.1" value={d} onChange={(e)=>setD(Number(e.target.value))} />
                                        </div>

                                        <div>
                                            <div className="flex justify-between mb-2">
                                                <span className="font-bold">規制時間 (制限)</span>
                                                <span className="text-orange-600 font-black">{limitHours.toFixed(1)}時間</span>
                                            </div>
                                            <input type="range" min="2" max="5" step="0.5" value={limitHours} onChange={(e)=>setLimitHours(Number(e.target.value))} />
                                        </div>
                                    </div>
                                </div>

                                <div className={`p-6 rounded-2xl shadow-inner text-center border-t-4 ${isOk ? 'bg-blue-50 border-blue-500' : 'bg-red-50 border-red-500'}`}>
                                    <div className="text-xs font-bold text-slate-500 uppercase">Judgment</div>
                                    <div className={`text-4xl font-black my-1 ${isOk ? 'text-blue-600' : 'text-red-600'}`}>
                                        {isOk ? "適合" : "不適合"}
                                    </div>
                                    <div className="text-sm font-bold text-slate-600">
                                        日影時間: {currentDuration.toFixed(1)} / {limitHours.toFixed(1)}h
                                    </div>
                                </div>
                            </div>

                            {/* グラフィックエリア */}
                            <div className="lg:col-span-2 space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-6 flex items-center">
                                        <span className="w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                                        建物高さ × 境界距離 限界曲線
                                    </h3>
                                    <div className="h-[300px] w-full">
                                        <ResponsiveContainer>
                                            <AreaChart data={chartData} margin={{ top: 10, right: 10, left: -10, bottom: 20 }}>
                                                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false} />
                                                <XAxis dataKey="距離" label={{ value: '距離 (m)', position: 'insideBottom', offset: -10, fontSize: 11 }} />
                                                <YAxis domain={[0, 45]} label={{ value: '高さ (m)', angle: -90, position: 'insideLeft', fontSize: 11 }} />
                                                <Tooltip />
                                                <Area type="monotone" dataKey="限界高さ" stroke="#2563eb" strokeWidth={3} fill="#dbeafe" />
                                                <ReferenceDot x={d} y={h} r={8} fill={isOk ? "#2563eb" : "#ef4444"} stroke="#fff" strokeWidth={3} />
                                            </AreaChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h3 className="text-sm font-bold text-slate-700 mb-4 tracking-wider flex items-center gap-2">
                                        📐 断面図 (単位:m)
                                    </h3>
                                    <div className="relative w-full aspect-[21/9] bg-slate-50 rounded-xl border border-slate-100 p-4">
                                        <svg viewBox="-50 -20 450 150" className="w-full h-full overflow-visible">
                                            {/* 目盛り: 高さ(Y軸) */}
                                            {[0, 10, 20, 30, 40].map(val => (
                                                <g key={val}>
                                                    <line x1="-5" y1={100 - (val * 2.5)} x2="0" y2={100 - (val * 2.5)} stroke="#cbd5e1" />
                                                    <text x="-30" y={103 - (val * 2.5)} fontSize="8" fill="#94a3b8">{val}m</text>
                                                </g>
                                            ))}
                                            
                                            {/* 目盛り: 距離(X軸) */}
                                            {[0, 10, 20, 30, 40].map(val => (
                                                <g key={val}>
                                                    <line x1={val * 8} y1="100" x2={val * 8} y2="105" stroke="#cbd5e1" />
                                                    <text x={-5 + (val * 8)} y="115" fontSize="8" fill="#94a3b8">{val}m</text>
                                                </g>
                                            ))}

                                            {/* 地面 */}
                                            <line x1="-20" y1="100" x2="400" y2="100" stroke="#64748b" strokeWidth="2" />
                                            
                                            {/* 影のグレー塗りつぶし (16:00の影を基準に最大範囲を描画) */}
                                            {(() => {
                                                const alt16 = calculateSunAlt(16);
                                                const shadowMax = (h - z) / Math.tan(alt16);
                                                return (
                                                    <polygon 
                                                        points={`0,${100 - (h * 2.5)} 0,${100 - (z * 2.5)} ${shadowMax * 8},${100 - (z * 2.5)}`} 
                                                        fill="#e2e8f0" 
                                                        opacity="0.8"
                                                    />
                                                );
                                            })()}

                                            {/* 判定面 */}
                                            <line x1="-20" y1={100 - (z * 2.5)} x2="400" y2={100 - (z * 2.5)} stroke="#94a3b8" strokeDasharray="3 2" />
                                            <text x="350" y={95 - (z * 2.5)} fontSize="8" fill="#94a3b8">判定面 Z={z}m</text>
                                            
                                            {/* 建物 (右辺を 0m 地点に) */}
                                            <rect x="-20" y={100 - (h * 2.5)} width="20" height={h * 2.5} fill="#1e293b" />
                                            <text x="-20" y={90 - (h * 2.5)} fontSize="9" fontWeight="bold" fill="#1e293b">建物 H={h}m</text>
                                            
                                            {/* 境界線 */}
                                            <line x1={d * 8} y1="-10" x2={d * 8} y2="100" stroke="#ef4444" strokeWidth="2" strokeDasharray="4 2" />
                                            <text x={5 + (d * 8)} y="-5" fontSize="9" fill="#ef4444" fontWeight="bold">境界 D={d}m</text>

                                            {/* 太陽光線（斜辺） */}
                                            {sunLines.map((sun, i) => {
                                                const shadowL = (h - z) / Math.tan(sun.alt);
                                                const xEnd = shadowL * 8;
                                                const yEnd = 100 - (z * 2.5);
                                                return (
                                                    <g key={sun.time}>
                                                        <line x1="0" y1={100 - (h * 2.5)} x2={xEnd} y2={yEnd} 
                                                              stroke="#f59e0b" strokeWidth="1.5" />
                                                        <text x={xEnd + 2} y={yEnd - 2} fontSize="7" fill="#d97706" fontWeight="bold">
                                                            {sun.time}の太陽光
                                                        </text>
                                                    </g>
                                                );
                                            })}
                                        </svg>
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-2 italic">※グレー部分は判定面(Z)より上に生じる影の範囲を示しています。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShadowSimulator />);
    </script>
</body>
</html>
